name: Cypress E2E Tests

on:
  push:
  pull_request:

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Create Cypress env file
        run: |
          echo '${{ secrets.SAUCEDEMO_USERS }}' > users.json
          echo '{"users":'$(cat users.json)'}' > cypress.env.json
          rm users.json

      - name: Run Cypress tests
        run: npm run cy:run